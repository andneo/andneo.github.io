<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" role="img" aria-label="Magnifying glass">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7f9"/>
      <stop offset=".22" stop-color="#dce2e6"/>
      <stop offset=".50" stop-color="#f7f9fa"/>
      <stop offset=".78" stop-color="#c5ccd1"/>
      <stop offset="1" stop-color="#eef2f4"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f3"/>
      <stop offset=".28" stop-color="#aab1b5"/>
      <stop offset=".52" stop-color="#f8fafb"/>
      <stop offset=".76" stop-color="#8e959a"/>
      <stop offset="1" stop-color="#d4d9dc"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7350a4"/>
      <stop offset=".25" stop-color="#5b3d8f"/>
      <stop offset=".58" stop-color="#6d4c9d"/>
      <stop offset=".82" stop-color="#4e347d"/>
      <stop offset="1" stop-color="#7656a6"/>
    </linearGradient>
    <radialGradient id="ringHighlight" cx=".30" cy=".20" r=".85">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".62"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".16"/>
    </radialGradient>
    <linearGradient id="handleHighlight" x1=".1" y1=".05" x2=".9" y2=".95">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".30" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset=".75" stop-color="#000000" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".22"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <path d="M1246 1206 C1292 1234 1340 1264 1394 1297" fill="none" stroke="url(#metal)" stroke-width="92" stroke-linecap="round"/>
    <path d="M1248 1198 C1290 1225 1334 1253 1378 1280" fill="none" stroke="#ffffff" stroke-opacity=".30" stroke-width="18" stroke-linecap="round"/>

    <path d="M1367 1268
             C1412 1261 1477 1283 1547 1326
             L1908 1548
             C1970 1586 1985 1636 1957 1673
             C1930 1708 1881 1701 1827 1671
             L1467 1472
             C1398 1434 1345 1384 1324 1342
             C1312 1318 1329 1282 1367 1268 Z"
          fill="url(#handle)"/>
    <path d="M1372 1289
             C1434 1280 1499 1314 1558 1351
             L1883 1550
             C1917 1571 1937 1591 1947 1611"
          fill="none" stroke="url(#handleHighlight)" stroke-width="26" stroke-linecap="round" opacity=".72"/>

    <circle cx="716" cy="980" r="559" fill="none" stroke="url(#ring)" stroke-width="78"/>
    <circle cx="716" cy="980" r="559" fill="none" stroke="url(#ringHighlight)" stroke-width="74"/>
    <circle cx="716" cy="980" r="521" fill="none" stroke="#596168" stroke-opacity=".65" stroke-width="5"/>
    <circle cx="716" cy="980" r="598" fill="none" stroke="#6c7378" stroke-opacity=".52" stroke-width="5"/>
    <path d="M228 684 A559 559 0 0 1 806 429" fill="none" stroke="#ffffff" stroke-opacity=".34" stroke-width="12" stroke-linecap="round"/>
    <path d="M337 1430 A559 559 0 0 0 1100 1400" fill="none" stroke="#7b8389" stroke-opacity=".25" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
